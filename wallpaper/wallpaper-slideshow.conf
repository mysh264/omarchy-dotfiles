# Wallpaper slideshow settings.
# After changing INTERVAL_SEC, restart the service:
#   systemctl --user restart wallpaper-slideshow.service

# Folder to scan (recursive). Put images in here or in subfolders.
WALLPAPER_DIR="${HOME}/.Wallpapers"

# Seconds between wallpaper changes. 300 = 5 minutes.
# Examples: 60 (1 min), 300 (5 min), 600 (10 min), 1800 (30 min)
INTERVAL_SEC=300
